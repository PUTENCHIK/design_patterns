upstream study2025_8081 {
    server study2025_8081:8080;
}

upstream study2025_8082 {
    server study2025_8082:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name study2025.proxy;

    location /api/reports {
        proxy_pass http://study2025_8081
    }

    location /api/dictionary {
        proxy_pass http://study2025_8082;
    }
}